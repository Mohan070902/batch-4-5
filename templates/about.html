{% extends "base.html"%}

{%block title%} ABOUT {%endblock%}

{%block content%}
<h1>Student List</h1>
<table border="2">
    <tr>
        <th>ID</th>
        <th>NAME</th>
        <th>COURSE</th>
    </tr>

    {%for i in students%}
    <tr>
        <td>{{i[0]}}</td>
        <td>{{i[1]}}</td>
        <td>{{i[2]}}</td>
    </tr>
    {%endfor%}    
</table><br><br>
<a href="{{url_for('add')}}"><button>ADD</button></a>
<a href="{{url_for('update')}}"><button>UPDATE</button></a>
<a href="{{url_for('delete')}}"><button>DELETE</button></a>
{%endblock%}
